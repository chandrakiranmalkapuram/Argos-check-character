<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C" />
      <stop offset="100%" stop-color="#1E3E62" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>
  <!-- Outer Rounded Shield -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#shieldGrad)" />
  <!-- Inner Border Stroke -->
  <rect x="8" y="8" width="84" height="84" rx="22" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />
  
  <!-- Stylized Circular Check Track -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4" stroke-dasharray="130 55" stroke-linecap="round" transform="rotate(-45 50 50)" />
  
  <!-- Bold Stylized Letter C -->
  <path d="M 62 32 C 40 24, 28 38, 28 50 C 28 62, 40 76, 62 68" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" />
  
  <!-- Precision Checkmark Badge -->
  <circle cx="68" cy="52" r="14" fill="url(#accentGrad)" />
  <path d="M 63 52 L 67 56 L 74 48" fill="none" stroke="#0B192C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
